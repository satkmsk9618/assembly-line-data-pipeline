[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assembly-line-pipeline"
version = "0.4.0"
description = "An assembly-line data pipeline and live dashboard built with simulated production events"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "psycopg[binary]>=3.2,<4", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-dotenv>=1.0,<2", "reportlab>=4.2,<5"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.67,<1.68", "altair>=6.3,<7", "requests>=2.32,<3", "supabase>=2.15,<3"]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1"]

[project.scripts]
assembly-line = "assembly_line.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
