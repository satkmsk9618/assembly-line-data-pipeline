x-app: &app
  build: .
  image: assembly-line-data-pipeline:latest

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assembly_line}
      POSTGRES_USER: ${POSTGRES_USER:-assembly_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    <<: *app
    command: ["uvicorn", "assembly_line.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-assembly_app}:${POSTGRES_PASSWORD:-change-me-locally}@db:5432/${POSTGRES_DB:-assembly_line}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      simulator:
        condition: service_healthy
  simulator:
    <<: *app
    command: ["python", "-m", "assembly_line.simulator"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-assembly_app}:${POSTGRES_PASSWORD:-change-me-locally}@db:5432/${POSTGRES_DB:-assembly_line}
      LIVE_INTERVAL_SECONDS: ${LIVE_INTERVAL_SECONDS:-10}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from assembly_line.db import connect; c=connect(); c.execute('SELECT recorded_ts FROM fact_defect LIMIT 0'); c.close()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
  dashboard:
    <<: *app
    command: ["streamlit", "run", "src/assembly_line/dashboard.py", "--server.address=0.0.0.0"]
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
volumes:
  postgres_data:
