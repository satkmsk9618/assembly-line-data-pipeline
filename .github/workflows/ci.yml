name: Python CI
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dashboard,dev]'
      - run: python -c 'import altair, streamlit; assert tuple(map(int, altair.__version__.split(".")[:2])) >= (6, 3); print("Streamlit", streamlit.__version__, "Altair", altair.__version__)'
      - run: pytest
