name: Opt-in daily assembly line PDF reports

on:
  schedule:
    - cron: "0 * * * *" # Check hourly; each user chooses a local send hour.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check email settings
        id: email_settings
        env:
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          REPORT_SMTP_HOST: ${{ secrets.REPORT_SMTP_HOST }}
          REPORT_SMTP_USERNAME: ${{ secrets.REPORT_SMTP_USERNAME }}
          REPORT_SMTP_PASSWORD: ${{ secrets.REPORT_SMTP_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [[ -n "$DATABASE_URL" && -n "$REPORT_EMAIL_FROM" && -n "$REPORT_SMTP_HOST" && -n "$REPORT_SMTP_USERNAME" && -n "$REPORT_SMTP_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.email_settings.outputs.configured == 'true'
      - uses: actions/setup-python@v5
        if: steps.email_settings.outputs.configured == 'true'
        with:
          python-version: "3.12"
      - name: Install project
        if: steps.email_settings.outputs.configured == 'true'
        run: python -m pip install -e '.[dashboard,dev]'
      - name: Send due opt-in PDF reports from PostgreSQL history
        if: steps.email_settings.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          REPORT_SMTP_HOST: ${{ secrets.REPORT_SMTP_HOST }}
          REPORT_SMTP_PORT: ${{ vars.REPORT_SMTP_PORT || '587' }}
          REPORT_SMTP_SECURITY: ${{ vars.REPORT_SMTP_SECURITY || 'starttls' }}
          REPORT_SMTP_USERNAME: ${{ secrets.REPORT_SMTP_USERNAME }}
          REPORT_SMTP_PASSWORD: ${{ secrets.REPORT_SMTP_PASSWORD }}
        run: python -m assembly_line.scheduled_reports
      - name: Explain skipped delivery
        if: steps.email_settings.outputs.configured != 'true'
        run: echo "Skipped email; add DATABASE_URL and SMTP secrets described in docs/daily-report.md."
