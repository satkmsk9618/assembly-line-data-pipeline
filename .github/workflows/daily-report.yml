name: Daily assembly line report

on:
  schedule:
    - cron: "0 9 * * *" # GitHub Actions schedules use UTC.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check email settings
        id: email_settings
        env:
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          REPORT_SMTP_HOST: ${{ secrets.REPORT_SMTP_HOST }}
          REPORT_SMTP_USERNAME: ${{ secrets.REPORT_SMTP_USERNAME }}
          REPORT_SMTP_PASSWORD: ${{ secrets.REPORT_SMTP_PASSWORD }}
        run: |
          if [[ -n "$REPORT_EMAIL_TO" && -n "$REPORT_EMAIL_FROM" && -n "$REPORT_SMTP_HOST" && -n "$REPORT_SMTP_USERNAME" && -n "$REPORT_SMTP_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.email_settings.outputs.configured == 'true'
      - uses: actions/setup-python@v5
        if: steps.email_settings.outputs.configured == 'true'
        with:
          python-version: "3.12"
      - name: Install project
        if: steps.email_settings.outputs.configured == 'true'
        run: python -m pip install -e '.[dev]'
      - name: Generate a recent simulated production sample
        if: steps.email_settings.outputs.configured == 'true'
        run: |
          start_at="$(python -c 'from datetime import datetime, timedelta, timezone; print((datetime.now(timezone.utc) - timedelta(hours=70)).replace(microsecond=0).isoformat())')"
          assembly-line generate --vehicles 1000 --seed "$GITHUB_RUN_NUMBER" --start-at "$start_at"
          assembly-line run
      - name: Email the 24-hour report
        if: steps.email_settings.outputs.configured == 'true'
        env:
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          REPORT_SMTP_HOST: ${{ secrets.REPORT_SMTP_HOST }}
          REPORT_SMTP_PORT: ${{ vars.REPORT_SMTP_PORT || '587' }}
          REPORT_SMTP_SECURITY: ${{ vars.REPORT_SMTP_SECURITY || 'starttls' }}
          REPORT_SMTP_USERNAME: ${{ secrets.REPORT_SMTP_USERNAME }}
          REPORT_SMTP_PASSWORD: ${{ secrets.REPORT_SMTP_PASSWORD }}
        run: python -m assembly_line.report --processed data/processed --window-hours 24
      - name: Explain skipped delivery
        if: steps.email_settings.outputs.configured != 'true'
        run: echo "Skipped email; add the REPORT_* SMTP repository secrets described in docs/daily-report.md."
